<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#fff4e2;padding:32px 16px">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;padding:28px">
    <div style="font-size:40px;line-height:1">🍕</div>
    <h1 style="margin:12px 0 8px;font-size:22px;color:#1f130d">Your Pizza Service sign-in code</h1>
    <p style="margin:0 0 16px;font-size:16px;color:#3b2a20">Enter this code in the app. It works once and expires in an hour.</p>
    <p style="margin:0 0 20px;font-size:34px;font-weight:800;letter-spacing:.3em;color:#c93a22">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;color:#9a8270">Didn't ask to sign in? You can ignore this email.</p>
  </div>
</div>
